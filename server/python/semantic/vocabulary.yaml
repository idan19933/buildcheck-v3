# ────────────────────────────────────────────────── BOUNDARIES & ZONING ──
# Plot edges, building lines, neighbour lots, setback markers. The classifier
# tags these so the extractor can pair them with measured distances later.
boundaries:
  - key: plot_boundary
    canonical_he: "גבול מגרש"
    aliases: ["גבול המגרש", "קו מגרש"]
  - key: building_line
    canonical_he: "קו בניין"
    aliases: ["ק. בניין", "קוו בניין", "קו בנין"]
  - key: neighbour_plot
    canonical_he: "מגרש שכן"
    aliases: ["שכן מגרש", "ש. מגרש", "גבול שכן"]
  - key: lot_entrance
    canonical_he: "כניסה למגרש"
    aliases: ["כניסה לחצר", "פתח כניסה"]
  - key: street
    canonical_he: "רחוב"
    aliases: ["כביש", "דרך"]
  - key: public_open_space
    canonical_he: 'שצ"פ'
    aliases: ["שצפ", "שטח ציבורי פתוח", "שב\"צ", "שבצ"]
  - key: built_parapet
    canonical_he: "מעקה בנוי"
