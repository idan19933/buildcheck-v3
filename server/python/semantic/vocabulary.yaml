    aliases: ["חדר אמבטיה", "אמבטיה הורים", "אמבטיה ילדים"]
  - key: shower_room
    canonical_he: "מקלחת"
    aliases: ["חדר מקלחת", "מקלחון"]
  - key: toilet
    canonical_he: "שירותים"
    aliases: ["שרותים", "שירותי אורחים", "ש.אורחים"]
  - key: laundry
    canonical_he: "כביסה"
    aliases: ["חדר כביסה", "מסתור כביסה", "מסתור"]
  - key: office_room
    canonical_he: "ח. עבודה"
    aliases: ["חדר עבודה", "ח.עבודה", "פ. עבודה", "עבודה"]
  - key: closet_room
    canonical_he: "ח. ארונות"
    aliases: ["חדר ארונות", "ארונות", "וולק-אין"]
  - key: storage
    canonical_he: "מחסן"
    aliases: ["חדר מחסן", "מ. אחסון", "אחסון"]
  - key: entrance_hall
