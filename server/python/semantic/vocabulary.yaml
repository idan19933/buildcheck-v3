    aliases: ["אבן", "ציפוי אבן", "חיפוי אבן"]
  - key: stone_quarry
    canonical_he: "אבן ניסור"
    aliases: ["אבן מנוסרת"]
  - key: brick_clay
    canonical_he: "לבני יציקה"
    aliases: ["לבני שריפה", "לבנים אדומות"]
