# ────────────────────────────────────────────────── DIMENSION MODIFIERS ──
# Words that modify or qualify dimensions — should be classified semantically
# but NOT treated as standalone numeric values.
dimension_modifiers:
  - key: scale_label
    canonical_he: "קנ\"מ"
    aliases: ["קנמ", "קנה מידה", "קנ.מ"]
  - key: density_label
    canonical_he: "צפיפות לפי תקן"
    aliases: ["צפיפות"]
  - key: direction_north
    canonical_he: "צפון"
    aliases: ["צפ.", "צפ"]
  - key: direction_south
    canonical_he: "דרום"
    aliases: ["דר.", "דר"]
  - key: direction_east
    canonical_he: "מזרח"
    aliases: ["מז.", "מז"]
  - key: direction_west
    canonical_he: "מערב"
    aliases: ["מע.", "מע"]
  - key: floor_grade_label
    canonical_he: "רום"
    aliases: ["מפלס", "גובה"]
  - key: ground_zero
    canonical_he: 'מפלס ±0.00'
    aliases: ["±0.00", "0.00"]

# ────────────────────────────────────────────────── NOISE ──
# Patterns that look like text but carry zero semantic content. The
# classifier short-circuits to NOISE when it sees these so they don't
# eat fuzzy-match budget. (Mojibake itself is detected algorithmically,
# not by enumeration — these are the literal short strings worth listing.)
noise:
  - key: empty_marker
    canonical_he: "—"
    aliases: ["-", "·", "•", "*", "."]
  - key: number_only_dot
    canonical_he: "."
    aliases: [".."]
  - key: page_break
    canonical_he: ""
    aliases: ["___"]
