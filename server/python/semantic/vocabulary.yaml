# Controlled vocabulary for Israeli residential permit DXFs.
# Every term reads ONLY post-decode (after \U+XXXX escapes are resolved + SHX
# stroke-Latin is mapped back to Hebrew where applicable). The classifier
# matches against `canonical_he` (highest weight), then `aliases`.
#
# Keep entries SHORT — one-word or short-phrase Hebrew terms only.
# Long sentences belong in the LLM-review queue, not here.
#
# WHEN ADDING ENTRIES:
#   1. Bump meta.version (semver patch).
#   2. Update meta.updated_at (ISO date).
#   3. Run unit + integration tests.
#   4. Re-run the classifier against committed reference DXFs and confirm
#      no regressions in the unclassified count.

meta:
  version: "1.0.0"
  updated_at: "2026-04-23"
  language: "he"
  scope: "Israeli residential permit DXFs (תכניות בנייה)"
  notes: "Aliases include common spelling variants, abbreviations, and
    the punctuation styles architects use ('ממ\"ד', 'ממד', 'ממ.ד')."

# ────────────────────────────────────────────────── ROOMS / SPACES ──
# Every interior room a residential floor plan can label. The canonical
# form is what shows up in a clean DXF; aliases cover handwriting-style
# variants the classifier should still match.
rooms:
  - key: kitchen
    canonical_he: "מטבח"
    aliases: ["מטבחון", "פינת מטבח"]
  - key: living_room
    canonical_he: "סלון"
    aliases: ["סלון אורחים", "ח. דיור", "חדר דיור", "דיור"]
  - key: dining
    canonical_he: "פינת אוכל"
    aliases: ["פ. אוכל", "אוכל", "חדר אוכל"]
  - key: master_bedroom
    canonical_he: "ח. הורים"
    aliases: ["חדר הורים", "ח.הורים", "הורים"]
  - key: bedroom
    canonical_he: "ח. שינה"
    aliases: ["חדר שינה", "ח.שינה", "שינה", "ח. שינה 1", "ח. שינה 2",
              "חדר ילדים", "חדר ילדה", "חדר ילד"]
  - key: bathroom_main
