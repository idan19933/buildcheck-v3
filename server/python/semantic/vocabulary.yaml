    aliases: ["חתך 1-1", "חתך 2-2", "חתך 3-3", "חתך 4-4"]
  - key: elevation
    canonical_he: "חזית"
    aliases: ["חזית צפונית", "חזית דרומית", "חזית מזרחית", "חזית מערבית"]
